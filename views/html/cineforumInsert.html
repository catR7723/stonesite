<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - Inserisci Film (Cineforum)</title>
  <link rel="stylesheet" href="/assets/css/laboratori/cineforum.css?v=1.3">
  <style>
    /* Minime regole locali di fallback */
    .hidden { display: none !important; }
    .preview { max-width: 320px; border-radius: 8px; display:block; margin: 12px 0; }
    .btn { padding: 0.6rem 1rem; border-radius: 0.6rem; cursor:pointer; }
    .container { max-width: 1000px; margin: 2rem auto; padding: 1rem; }
    .film-archiviato { margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Area Cineforum — Inserimento / Gestione Film</h1>

    <!-- Upload Locandina -->
    <section class="locandina">
      <h2>1) Carica la locandina</h2>
      <form id="locandinaForm" enctype="multipart/form-data">
        <label id="carica" class="btn" for="file-input">Scegli file</label>
        <input id="file-input" name="locandina" type="file" accept="image/*" style="display:none">
        <div><small id="fileName">Nessun file selezionato</small></div>
      </form>

      <div id="previewArea">
        <img id="locandina-img" class="preview hidden" alt="Anteprima locandina">
        <div>
          <button id="deleteLocandina" class="btn hidden" type="button">Elimina la Locandina</button>
        </div>
      </div>
    </section>

    <!-- Moduli testo (visibili dopo upload) -->
    <section id="testiSection" class="ins hidden" style="margin-top:1.5rem;">
      <h2>2) Titolo / Trama / Discussione</h2>

      <form id="salvaLocandina" style="margin-bottom:12px;">
        <input id="inputTitolo" name="titoloFilm" type="text" placeholder="Inserisci il titolo del Film" style="width:68%;padding:8px">
        <button id="antTit" class="btn" type="submit">Anteprima Titolo del Film</button>
      </form>

      <form id="salvaTrama" style="margin-bottom:12px;">
        <textarea id="inputTrama" name="tramaFilm" placeholder="Trama" rows="5" style="width:100%;padding:8px"></textarea>
        <button id="salTrama" class="btn" type="submit">Salva Trama</button>
      </form>

      <form id="salvaDiscussione" style="margin-bottom:12px;">
        <textarea id="inputDiscussione" name="discussione" placeholder="Discussione" rows="5" style="width:100%;padding:8px"></textarea>
        <button id="salDisc" class="btn" type="submit">Salva Discussione</button>
      </form>
    </section>

    <!-- Salvataggio bozza / pubblicazione -->
    <section style="margin-top:1.5rem;">
      <form id="formSalva" style="display:inline-block;margin-right:12px;">
        <button id="btnSalvaFilm" class="btn" type="submit">Salva il Film (Bozza)</button>
      </form>
      <form id="formPubblica" style="display:inline-block;">
        <button id="pubblicaFilm" class="btn hidden" type="submit">Pubblica il Film!</button>
      </form>
    </section>

    <!-- Anteprime testo -->
    <section style="margin-top:2rem;">
      <h3>Anteprime</h3>
      <div>
        <h4 id="titoloFilm">-</h4>
        <p id="tramaFilm"></p>
        <p id="discussione"></p>
      </div>
    </section>

    <hr style="margin:2rem 0">

    <!-- Archivio (mostrato su richiesta) -->
    <section>
      <h2 id="toggle-archivio" class="clickable" style="cursor:pointer;">📚 Archivio Film (clicca per mostrare)</h2>
      <div id="archivio" style="display:none; margin-top:12px;"></div>
    </section>

    <hr style="margin:2rem 0">

    <!-- Logout -->
    <form action="/logout" method="POST">
      <button class="btn" type="submit">LogOut</button>
    </form>
  </div>

<script>
/* cineforumInsert.html — client-side completo per admin
   Endpoints usati:
   POST /cineforumInsert        (multipart form-data name=locandina)
   POST /deleteLocandina        (json { publicId?, filmId? })
   POST /salvaTitoloLocandina   (json { titoloFilm, filmId?, publicId? })
   POST /salvaTrama             (json { tramaFilm, filmId })
   POST /salvaDiscussione       (json { discussione, filmId })
   POST /salvaFilm              (json { filmId? })
   POST /salvaFilmR             (json { filmId? })
   GET  /api/archivio
   POST /deleteFilm             (json { filmId })
*/

const state = {
  _id: null,
  savedId: null,
  titolo: null,
  trama: null,
  discussione: null,
  nomeCartellaFilm: null,
  locandina: { url: null, publicId: null }
};

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function setLoadingButton(btn, loading, text) {
  if (!btn) return;
  if (loading) {
    btn._old = btn.textContent;
    btn.disabled = true;
    btn.textContent = text || 'Attendere...';
  } else {
    btn.disabled = false;
    if (btn._old) btn.textContent = btn._old;
  }
}
function showToast(msg) { alert(msg); } // semplice; puoi sostituire

/* ELEMENTS */
const fileInput = document.getElementById('file-input');
const fileNameSpan = document.getElementById('fileName');
const previewImg = document.getElementById('locandina-img');
const deleteBtn = document.getElementById('deleteLocandina');
const testiSection = document.getElementById('testiSection');
const archDiv = document.getElementById('archivio');
const toggleArchivio = document.getElementById('toggle-archivio');

/* --- FILE INPUT & UPLOAD --- */
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  fileNameSpan.textContent = file?.name || 'Nessun file selezionato';
  if (!file) return;
  // anteprima
  previewImg.src = URL.createObjectURL(file);
  previewImg.classList.remove('hidden');
  // upload
  await uploadLocandina(file);
});

async function uploadLocandina(file) {
  const btnLabel = document.getElementById('carica');
  setLoadingButton(btnLabel, true, 'Caricamento...');
  try {
    const fd = new FormData();
    fd.append('locandina', file);

    const targetUrl = window.location.pathname; // robusto rispetto al mount del router

    const res = await fetch(targetUrl, {
      method: 'POST',
      body: fd,
      credentials: 'include'
    });

    const contentType = res.headers.get('content-type') || '';
    let json;

    if (contentType.includes('application/json')) {
      json = await res.json(); // leggo solo una volta come JSON
    } else {
      const text = await res.text(); // leggo solo una volta come testo
      console.error('Risposta non-JSON da', targetUrl, 'status:', res.status, 'body:', text);
      throw new Error(`Server non ha ritornato JSON (status ${res.status}). Body: ${text.slice(0,300)}`);
    }

    console.log(targetUrl, '->', json);
    if (!res.ok || !json.success) {
      showToast('Errore upload: ' + (json.error || json.message || ('status ' + res.status)));
      return;
    }

    state.locandina.url = json.url || json.secure_url || null;
    state.locandina.publicId = json.publicId || json.public_id || null;
    if (json.filmId) { state._id = json.filmId; state.savedId = json.filmId; }

    previewImg.src = state.locandina.url || previewImg.src;
    previewImg.classList.remove('hidden');
    deleteBtn.classList.remove('hidden');
    testiSection.classList.remove('hidden');
    showToast('Locandina caricata');
  } catch (err) {
    console.error('uploadLocandina error', err);
    showToast('Errore upload: ' + (err.message || err));
  } finally {
    setLoadingButton(btnLabel, false);
  }
}

/* --- DELETE LOCANDINA (elimina immagine temporanea o associata) --- */
deleteBtn.addEventListener('click', async () => {
  if (!confirm('Sei sicuro di eliminare la locandina?')) return;
  setLoadingButton(deleteBtn, true, 'Eliminazione...');
  try {
    const body = { publicId: state.locandina.publicId || null, filmId: state.savedId || state._id || null };
    const res = await fetch('/deleteLocandina', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const json = await res.json();
    console.log('/deleteLocandina ->', json);
    if (!res.ok || !json.success) {
      showToast('Errore eliminazione: ' + (json.error || json.message || 'server'));
      return;
    }
    // pulisci stato e UI
    state.locandina = { url: null, publicId: null };
    state._id = null; state.savedId = null;
    previewImg.src = ''; previewImg.classList.add('hidden');
    deleteBtn.classList.add('hidden');
    testiSection.classList.add('hidden');
    fileInput.value = ''; fileNameSpan.textContent = 'Nessun file selezionato';
    showToast('Locandina eliminata');
  } catch (err) {
    console.error('deleteLocandina err', err);
    showToast('Errore: ' + err.message);
  } finally {
    setLoadingButton(deleteBtn, false);
  }
});

/* --- SALVA TITOLO (anteprima) --- */
document.getElementById('salvaLocandina').addEventListener('submit', async (e) => {
  e.preventDefault();
  const titolo = document.getElementById('inputTitolo').value.trim();
  const btn = document.getElementById('antTit');
  if (!titolo) { showToast('Inserisci il titolo'); return; }
  // aggiorna localmente subito
  state.titolo = titolo; document.getElementById('titoloFilm').textContent = escapeHtml(titolo);
  setLoadingButton(btn, true, 'Salvataggio...');
  try {
    const body = { titoloFilm: titolo, filmId: state.savedId || state._id || null, publicId: state.locandina.publicId || null };
    const res = await fetch('/salvaTitoloLocandina', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const json = await res.json();
    console.log('/salvaTitoloLocandina ->', json);
    if (!res.ok || !json.success) {
      showToast('Errore salvataggio titolo: ' + (json.error || json.message || 'server'));
      return;
    }
    // aggiorna stato con id restituito (se presente)
    if (json.filmId) { state.savedId = json.filmId; state._id = json.filmId; }
    if (json.film) {
      state.savedId = json.film._id || state.savedId;
      state.nomeCartellaFilm = json.film.nomeCartellaFilm || state.nomeCartellaFilm;
    }
    // mostra moduli se nascosti
    testiSection.classList.remove('hidden');
    showToast('Titolo salvato');
  } catch (err) {
    console.error('salvaTitolo error', err);
    showToast('Errore: ' + err.message);
  } finally {
    setLoadingButton(btn, false);
  }
});

/* --- SALVA TRAMA --- */
document.getElementById('salvaTrama').addEventListener('submit', async (e) => {
  e.preventDefault();
  const trama = document.getElementById('inputTrama').value.trim();
  const btn = document.getElementById('salTrama');
  if (!trama) { showToast('Inserisci la trama'); return; }
  // fallback titolo se necessario
  const titoloInputVal = document.getElementById('inputTitolo')?.value?.trim();
  if (!state.titolo && !titoloInputVal) { showToast('Salva prima il titolo (crea la bozza)'); return; }
  if (!state.titolo && titoloInputVal) { state.titolo = titoloInputVal; document.getElementById('titoloFilm').textContent = escapeHtml(titoloInputVal); }
  setLoadingButton(btn, true, 'Salvataggio...');
  try {
    const body = { tramaFilm: trama, filmId: state.savedId || state._id || null };
    const res = await fetch('/salvaTrama', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const json = await res.json();
    console.log('/salvaTrama ->', json);
    if (!res.ok || !json.success) { showToast('Errore salvataggio trama: ' + (json.error || json.message || 'server')); return; }
    state.trama = (json.film && json.film.trama) ? json.film.trama : trama;
    document.getElementById('tramaFilm').textContent = escapeHtml(state.trama);
    showToast('Trama salvata');
  } catch (err) {
    console.error('salvaTrama err', err);
    showToast('Errore: ' + err.message);
  } finally { setLoadingButton(btn, false); }
});

/* --- SALVA DISCUSSIONE --- */
document.getElementById('salvaDiscussione').addEventListener('submit', async (e) => {
  e.preventDefault();
  const discussione = document.getElementById('inputDiscussione').value.trim();
  const btn = document.getElementById('salDisc');
  if (!discussione) { showToast('Inserisci la discussione'); return; }
  const titoloInputVal = document.getElementById('inputTitolo')?.value?.trim();
  if (!state.titolo && !titoloInputVal) { showToast('Salva prima il titolo (crea la bozza)'); return; }
  if (!state.titolo && titoloInputVal) { state.titolo = titoloInputVal; document.getElementById('titoloFilm').textContent = escapeHtml(titoloInputVal); }
  setLoadingButton(btn, true, 'Salvataggio...');
  try {
    const body = { discussione: discussione, filmId: state.savedId || state._id || null };
    const res = await fetch('/salvaDiscussione', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const json = await res.json();
    console.log('/salvaDiscussione ->', json);
    if (!res.ok || !json.success) { showToast('Errore salvataggio discussione: ' + (json.error || json.message || 'server')); return; }
    state.discussione = (json.film && json.film.discussione) ? json.film.discussione : discussione;
    document.getElementById('discussione').textContent = escapeHtml(state.discussione);
    showToast('Discussione salvata');
  } catch (err) {
    console.error('salvaDiscussione err', err);
    showToast('Errore: ' + err.message);
  } finally { setLoadingButton(btn, false); }
});

/* --- SALVA FILM (BOZZA) --- */
document.getElementById('formSalva').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnSalvaFilm');
  // controlli
  if (!state.titolo) { showToast('Inserisci e salva il titolo prima'); return; }
  if (!state.trama) { showToast('Salva la trama prima'); return; }
  if (!state.discussione) { showToast('Salva la discussione prima'); return; }
  if (!state.locandina.url) { showToast('Carica la locandina prima'); return; }

  setLoadingButton(btn, true, 'Salvataggio...');
  try {
    const body = { filmId: state.savedId || state._id || null };
    const res = await fetch('/salvaFilm', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const json = await res.json();
    console.log('/salvaFilm ->', json);
    if (!res.ok || !json.success) { showToast('Errore salvataggio film: ' + (json.error || json.message || 'server')); return; }
    if (json.filmId) { state.savedId = json.filmId; state._id = json.filmId; }
    if (json.film && json.film._id) { state.savedId = json.film._id; state._id = json.film._id; }
    // mostra pubblica
    document.getElementById('pubblicaFilm').classList.remove('hidden');
    showToast('Film salvato come bozza');
  } catch (err) {
    console.error('salvaFilm err', err);
    showToast('Errore: ' + err.message);
  } finally { setLoadingButton(btn, false); }
});

/* --- PUBBLICA FILM --- */
document.getElementById('formPubblica').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!confirm('Sei sicuro di pubblicare il film?')) return;
  const btn = document.getElementById('pubblicaFilm');
  setLoadingButton(btn, true, 'Pubblicazione...');
  try {
    const body = { filmId: state.savedId || state._id || null };
    const res = await fetch('/salvaFilmR', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const json = await res.json();
    console.log('/salvaFilmR ->', json);
    if (!res.ok || !json.success) { showToast('Errore pubblicazione: ' + (json.error || json.message || 'server')); return; }
    showToast('Film pubblicato con successo!');
    // ricarica archivio per mostrare cambiamenti (se necessario)
    await caricaArchivio(true);

    // reindirizza a /cineforum dopo un breve ritardo per lasciare vedere il toast
    setTimeout(() => {
      window.location.href = '/cineforum';
    }, 900);

  } catch (err) {
    console.error('pubblica err', err);
    showToast('Errore: ' + err.message);
  } finally {
    setLoadingButton(btn, false);
  }
});

/* --- CARICA ARCHIVIO (con pulsante Elimina per ogni film) --- */
let archivioLoaded = false;
async function caricaArchivio(forceReload = false) {
  if (archivioLoaded && !forceReload) return;
  archDiv.innerHTML = '<p class="caricamento">Caricamento archivio...</p>';
  try {
    const res = await fetch('/api/archivio');
    const films = await res.json();
    if (!films || (Array.isArray(films) && films.length === 0)) {
      archDiv.innerHTML = `<p style="padding:14px; text-align:center;">Nessun film nell'archivio</p>`;
      archivioLoaded = true;
      return;
    }

    archDiv.innerHTML = '';
    films.forEach(film => {
      const div = document.createElement('div');
      div.className = 'film-archiviato';
      div.dataset.id = film._id;
      div.innerHTML = `
        <div style="display:flex;gap:12px;align-items:flex-start; border:1px solid #ddd; padding:12px; border-radius:8px;">
          ${film.locandinaUrl ? `<div style="flex:0 0 110px;"><img src="${escapeHtml(film.locandinaUrl)}" alt="${escapeHtml(film.titolo)}" style="width:110px;border-radius:6px;"></div>` : ''}
          <div style="flex:1;">
            <h4 style="margin:0 0 6px 0;">${escapeHtml(film.titolo)}</h4>
            <div style="color:#666; font-size:0.95em; margin-bottom:8px;">${escapeHtml(film.dataInserimento || '')}</div>
            <details style="margin-bottom:6px;"><summary>📖 Trama</summary><p>${escapeHtml(film.trama || '')}</p></details>
            <details><summary>💬 Discussione</summary><p>${escapeHtml(film.discussione || '')}</p></details>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end;">
            <button class="btn delete-film" data-id="${film._id}" style="background:#c0392b;color:white;">Elimina film</button>
          </div>
        </div>
      `;
      archDiv.appendChild(div);
    });

    // assegna listener elimina
    archDiv.querySelectorAll('.delete-film').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const filmId = btn.dataset.id;
        if (!filmId) return;
        if (!confirm('Eliminare definitivamente questo film?')) return;
        setLoadingButton(btn, true, 'Eliminazione...');
        try {
          const res = await fetch('/deleteFilm', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ filmId })
          });
          const json = await res.json();
          console.log('/deleteFilm ->', json);
          if (!res.ok || !json.success) {
            showToast('Errore eliminazione: ' + (json.error || json.message || 'server'));
            setLoadingButton(btn, false);
            return;
          }
          // rimuovi DOM block
          const block = btn.closest('.film-archiviato');
          if (block) block.remove();
          showToast('Film eliminato');
        } catch (err) {
          console.error('deleteFilm err', err);
          showToast('Errore: ' + err.message);
          setLoadingButton(btn, false);
        }
      });
    });

    archivioLoaded = true;
  } catch (err) {
    console.error('caricaArchivio err', err);
    archDiv.innerHTML = '<p style="color:red;">Errore caricamento archivio</p>';
  }
}

/* Toggle archivio visibile solo on click */
toggleArchivio.addEventListener('click', async () => {
  const visible = getComputedStyle(archDiv).display !== 'none';
  if (visible) {
    archDiv.style.display = 'none';
  } else {
    archDiv.style.display = 'block';
    await caricaArchivio();
  }
});

/* Inizializzazione: se vuoi, carica archivio automatico per admin (qui no) */
document.addEventListener('DOMContentLoaded', () => {
  // niente caricamento automatico; l'admin cliccherà "Archivio"
});
</script>
</body>
</html>
