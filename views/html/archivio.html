<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivio Ricette</title>
    <link rel="stylesheet" href="/assets/css/archivio.css">
       <style>
        .btn-delete {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="menu">
        <ul>
            <li class="home">
                <a href="/stone">Home</a>
            </li>
            <li>
                <a href="/archivio">Archivio</a>
            </li>
        </ul>
    </div>

    <div class="nav">
        <h1 class="title">📚 Archivio Ricette</h1>
        
        <div class="archivio-controls">
            <input type="text" id="searchInput" placeholder="Cerca ricetta...">
            <select id="filterSort">
                <option value="recent">Più recenti</option>
                <option value="oldest">Più antiche</option>
                <option value="title">Per titolo (A-Z)</option>
            </select>
        </div>

        <div id="archivioContainer" class="archivio-grid">
            <p class="loading">Caricamento archivio...</p>
        </div>
    </div>

    <div class="dev">CatRobotics DevSolutions</div>

  <script>
    let allRecipes = [];
    let isCucinaUser = false; 

    // Helper per estrarre in modo sicuro i dati dei piatti (primo, secondo, contorno)
    function getPiatto(p) {
        if (!p || typeof p !== 'object') return null;
        return {
            titolo: p.titolo || p.nome || p.title || '',
            imageUrl: p.imageUrl || p.url || p.immagine || p.foto || '',
            ingredienti: p.ingredienti || p.ingredients || '',
            descrizione: p.descrizione || p.preparazione || p.procedimento || ''
        };
    }

    // Controllo permessi e avvio al caricamento della pagina
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const authResponse = await fetch('/check-ruolo-cucina');
            const authData = await authResponse.json();
            
            if (authData.autorizzato) {
                isCucinaUser = true;
                console.log('✅ Utente abilitato come cucina.');
            } else {
                console.log('🔒 Utente non abilitato come cucina.');
            }
        } catch (err) {
            console.error('Errore nel controllo autenticazione:', err);
        }
        
        loadArchivio();
    });

    // Caricamento dell'archivio dal server
    async function loadArchivio() {
        try {
            const response = await fetch('/archivio-api');
            if (!response.ok) throw new Error('Errore durante la risposta del server');
            
            const rawData = await response.json();
            
            // Estrae l'array sia che arrivi diretto [...] sia che sia in { data: [...] } o { recipes: [...] }
            allRecipes = Array.isArray(rawData) ? rawData : (rawData.recipes || rawData.data || rawData.archivio || []);
            
            console.log('📦 Ricette caricate da MongoDB (archivios):', allRecipes);
            displayArchivio(allRecipes);
        } catch (err) {
            console.error('Errore di caricamento:', err);
            document.getElementById('archivioContainer').innerHTML = 
                '<p class="error">Errore nel caricamento dell\'archivio</p>';
        }
    }

    // Renderizzazione delle schede nell'HTML
    function displayArchivio(recipes) {
        const container = document.getElementById('archivioContainer');
        if (!container) return;
        
        if (!Array.isArray(recipes) || recipes.length === 0) {
            container.innerHTML = '<p class="empty">Nessuna ricetta nell\'archivio</p>';
            return;
        }

        container.innerHTML = recipes.map((recipe) => {
            const primo = getPiatto(recipe.primo);
            const secondo = getPiatto(recipe.secondo);
            const contorno = getPiatto(recipe.contorno);

            // Formattazione data archiviazione
            const dataFormatted = recipe.archiviataIl 
                ? new Date(recipe.archiviataIl).toLocaleDateString('it-IT') 
                : '';

            return `
                <div class="recipe-card" data-id="${recipe._id}">
                    <div class="recipe-header">
                        <h2>${recipe.title || 'Ricetta Senza Titolo'}</h2>
                        ${dataFormatted ? `<span class="date">${dataFormatted}</span>` : ''}
                    </div>
                    
                    <div class="recipe-content">
                        ${primo && primo.titolo ? `
                            <div class="piatto">
                                <h3>🍝 Primo</h3>
                                <p><strong>${primo.titolo}</strong></p>
                                ${primo.imageUrl ? `<img src="${primo.imageUrl}" alt="Primo" class="piatto-img">` : ''}
                            </div>
                        ` : ''}
                        
                        ${secondo && secondo.titolo ? `
                            <div class="piatto">
                                <h3>🍖 Secondo</h3>
                                <p><strong>${secondo.titolo}</strong></p>
                                ${secondo.imageUrl ? `<img src="${secondo.imageUrl}" alt="Secondo" class="piatto-img">` : ''}
                            </div>
                        ` : ''}
                        
                        ${contorno && contorno.titolo ? `
                            <div class="piatto">
                                <h3>🥗 Contorno</h3>
                                <p><strong>${contorno.titolo}</strong></p>
                                ${contorno.imageUrl ? `<img src="${contorno.imageUrl}" alt="Contorno" class="piatto-img">` : ''}
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="recipe-actions">
                        <button class="btn-view" onclick="viewRecipe('${recipe._id}')">👁️ Visualizza</button>
                        <button class="btn-delete" onclick="deleteRecipe('${recipe._id}')">🗑️ Elimina</button>
                    </div>
                </div>
            `;
        }).join('');

        // Mostra i bottoni elimina se l'utente ha il ruolo cucina
        if (isCucinaUser) {
            container.querySelectorAll('.btn-delete').forEach(btn => {
                btn.style.setProperty('display', 'inline-block', 'important');
            });
        }
    }

    // Filtra e ordina le ricette
    function filterAndSort() {
        const searchInput = document.getElementById('searchInput');
        const filterSort = document.getElementById('filterSort');
        const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
        const sortBy = filterSort ? filterSort.value : 'recent';

        let filtered = allRecipes.filter(recipe => {
            const title = (recipe.title || '').toLowerCase();
            const primo = (recipe.primo?.titolo || recipe.primo?.nome || '').toLowerCase();
            const secondo = (recipe.secondo?.titolo || recipe.secondo?.nome || '').toLowerCase();
            const contorno = (recipe.contorno?.titolo || recipe.contorno?.nome || '').toLowerCase();
            
            return title.includes(searchTerm) || 
                   primo.includes(searchTerm) || 
                   secondo.includes(searchTerm) || 
                   contorno.includes(searchTerm);
        });

        if (sortBy === 'recent') {
            filtered.sort((a, b) => new Date(b.archiviataIl || 0) - new Date(a.archiviataIl || 0));
        } else if (sortBy === 'oldest') {
            filtered.sort((a, b) => new Date(a.archiviataIl || 0) - new Date(b.archiviataIl || 0));
        } else if (sortBy === 'title') {
            filtered.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
        }

        displayArchivio(filtered);
    }

    // Collegamento event listeners per ricerca e ordinamento
    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('searchInput');
        const filterSort = document.getElementById('filterSort');
        if (searchInput) searchInput.addEventListener('input', filterAndSort);
        if (filterSort) filterSort.addEventListener('change', filterAndSort);
    });

    // Modale di visualizzazione dettaglio
    async function viewRecipe(id) {
        const recipe = allRecipes.find(r => r._id === id);
        if (!recipe) return;

        const primo = getPiatto(recipe.primo);
        const secondo = getPiatto(recipe.secondo);
        const contorno = getPiatto(recipe.contorno);
        const dataFormatted = recipe.archiviataIl 
            ? new Date(recipe.archiviataIl).toLocaleDateString('it-IT') 
            : '';

        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <span class="close" onclick="this.closest('.modal').remove()">✕</span>
                <h1>${recipe.title || 'Ricetta'}</h1>
                ${dataFormatted ? `<p class="meta">Archiviata il: ${dataFormatted}</p>` : ''}
                
                ${primo && primo.titolo ? `
                    <div class="modal-section">
                        <h2>🍝 Primo: ${primo.titolo}</h2>
                        ${primo.imageUrl ? `<img src="${primo.imageUrl}" alt="Primo">` : ''}
                        ${primo.ingredienti ? `<p><strong>Ingredienti:</strong> ${primo.ingredienti}</p>` : ''}
                        ${primo.descrizione ? `<p><strong>Preparazione:</strong> ${primo.descrizione}</p>` : ''}
                    </div>
                ` : ''}
                
                ${secondo && secondo.titolo ? `
                    <div class="modal-section">
                        <h2>🍖 Secondo: ${secondo.titolo}</h2>
                        ${secondo.imageUrl ? `<img src="${secondo.imageUrl}" alt="Secondo">` : ''}
                        ${secondo.ingredienti ? `<p><strong>Ingredienti:</strong> ${secondo.ingredienti}</p>` : ''}
                        ${secondo.descrizione ? `<p><strong>Preparazione:</strong> ${secondo.descrizione}</p>` : ''}
                    </div>
                ` : ''}
                
                ${contorno && contorno.titolo ? `
                    <div class="modal-section">
                        <h2>🥗 Contorno: ${contorno.titolo}</h2>
                        ${contorno.imageUrl ? `<img src="${contorno.imageUrl}" alt="Contorno">` : ''}
                        ${contorno.ingredienti ? `<p><strong>Ingredienti:</strong> ${contorno.ingredienti}</p>` : ''}
                        ${contorno.descrizione ? `<p><strong>Preparazione:</strong> ${contorno.descrizione}</p>` : ''}
                    </div>
                ` : ''}
            </div>
        `;

        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.remove();
        });

        document.body.appendChild(modal);
    }

    // Cancellazione ricetta
    async function deleteRecipe(id) {
        const recipe = allRecipes.find(r => r._id === id);
        const title = recipe ? recipe.title : 'questa ricetta';

        if (!confirm(`Eliminare definitivamente "${title}"?`)) return;

        try {
            const response = await fetch(`/archivio/${id}`, { 
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' }
            });
            
            if (response.ok) {
                alert('Ricetta eliminata correttamente!');
                loadArchivio();
            } else {
                const errData = await response.json();
                alert('Errore durante l\'eliminazione: ' + (errData.error || response.statusText));
            }
        } catch (err) {
            console.error('Errore:', err);
            alert('Errore di rete durante la cancellazione');
        }
    }
</script>

</body>
</html>
