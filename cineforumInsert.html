<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserisci il Film</title>
    <script src="/routes/cineforumInsert.js"></script>
    <link rel="stylesheet" href="/assets/css/cineforumInsert.css">
    <link rel="stylesheet" href="/assets/css/laboratori/cineforum.css">
</head>
<body>
  <!-- 📸 SEZIONE UPLOAD LOCANDINA -->
  <div class="locandina">
    <h1>Carica La Locandina del Film della Settimana</h1>
    <form action="/cineforumInsert" method="POST" enctype="multipart/form-data" id="locandina">
      <div class="scegli">
        <label id="carica" for="file-input">Scegli File</label>
        <input type="file" name="locandina" id="file-input" required onchange="mostraBottone(); mostraFileName()">
        <span id="fileName">Nessun file selezionato</span>
      </div>
      <button type="submit" id="btn-anteprima" style="display: none;">Anteprima della Locandina</button>
    </form> 
  </div>

  <!-- 🎬 SEZIONE FILM -->
  <div class="Conteiner_Film">
    <div class="imgLoc">
      <!-- 📷 IMMAGINE CLOUDINARY -->
      <img id="locandina-img" src="" alt="locandina" width="200" style="display: none;" onerror="this.style.display='none'; document.getElementById('form-cancella').style.display='none';">

      <!-- ❌ PULSANTE ELIMINA -->
      <form action="/deleteLocandina" method="POST" id="form-cancella" style="display: none;">
        <button class="btn" type="submit" id="deleteLocandina">Elimina la Locandina</button>
      </form>
    </div>
   
    <!-- 📝 SEZIONE TESTI ANTEPRIMA -->
    <div class="film">
      <h1 id="titoloFilm"></h1>
      <h1 id="tramaFilm"></h1>
      <h1 id="discussione"></h1>
    </div>

    <!-- ✏️ MODULI DI INSERIMENTO (nascosti di default) -->
    <div class="ins" style="display: none;">
      <form action="/salvaTitoloLocandina" id="salvaLocandina" method="POST">
        <input type="text" id="inputTitolo" name="titoloFilm" placeholder="Inserisci il titolo del Film" required>
        <button class="btn" id="antTit" type="submit">Anteprima Titolo del Film</button>
      </form>

      <form action="/salvaTrama" id="salvaTrama" method="POST">
        <textarea name="tramaFilm" placeholder="Trama" required></textarea>
        <button type="submit" id="salTrama">Salva Trama</button>
      </form>

      <form action="/salvaDiscussione" id="salvaDiscussione" method="POST">
        <textarea name="discussione" placeholder="Discussione" required></textarea>
        <button type="submit" id="salDisc">Salva Discussione</button>
      </form>
    </div> 
  </div>

  <!-- 🎯 PULSANTI FINALI -->
  <div class="azioni-finali">
    <!-- 💾 SALVA IL FILM -->
    <form action="/salvaFilm" method="POST" id="formSalva">
      <button class="btn" type="submit" id="salvaFilm" onclick="mostraPubblica()">Salva il Film</button>
    </form>
    
    <!-- 📢 PUBBLICA IL FILM -->
    <form action="/salvaFilmR" method="POST" id="formPubblica" style="display: none;">
      <button class="btn" type="submit" id="pubblicaFilm">Pubblica il Film!</button>
    </form>
  </div>

  <!-- 🚪 LOGOUT -->
  <form action="/logout" method="POST">
    <button class="btn" type="submit" id="logout">LogOut</button>
  </form>

  <!-- 📚 ARCHIVIO CON CHECKBOX -->
  <input type="checkbox" id="sidebar-archivio">
  <label for="sidebar-archivio" class="open-archivio">
    <h1 class="w-archivio">Archivio</h1>
  </label>
  <label for="sidebar-archivio" id="overlay-archivio">
    <div id="archivio">
      <!-- I film verranno caricati qui -->
    </div>
  </label>

  <!-- 📜 JAVASCRIPT -->
  <script>
    // 1️⃣ Gestisce l'apparizione del tasto "Anteprima" quando l'utente seleziona un file
    function mostraBottone() {
      const fileInput = document.getElementById('file-input');
      const btnAnteprima = document.getElementById('btn-anteprima');
      
      if (fileInput && fileInput.files.length > 0) {
        if (btnAnteprima) btnAnteprima.style.display = 'block'; 
      } else {
        if (btnAnteprima) btnAnteprima.style.display = 'none';
      }
    }

    // 2️⃣ Controlla AUTOMATICAMENTE se la locandina esiste già al caricamento della pagina
    window.addEventListener('DOMContentLoaded', () => {
      const img = document.getElementById('locandina-img');
      const divIns = document.querySelector('.ins');
      const formCancella = document.getElementById('form-cancella');

      if (img && divIns) {
        // Verifica se il file sul server è valido
        const testImg = new Image();
        testImg.src = img.src;

        testImg.onload = function() {
          // Se l'immagine esiste, mostra i moduli
          divIns.style.display = 'block';
          if (formCancella) formCancella.style.display = 'block';
        };

        testImg.onerror = function() {
          // Se l'immagine non esiste, nasconde i moduli
          divIns.style.display = 'none';
          if (formCancella) formCancella.style.display = 'none';
        };
      }

      // Carica l'archivio
      caricaArchivio();
    });

    // 3️⃣ Mostra il nome del file selezionato
    function mostraFileName() {
      const fileInput = document.getElementById('file-input');
      const fileName = document.getElementById('fileName');
      
      if (fileInput.files.length > 0) {
        fileName.textContent = fileInput.files[0].name;
      } else {
        fileName.textContent = 'Nessun file selezionato';
      }
    }

    // 4️⃣ Gestisce la visibilità del pulsante "Pubblica"
    function mostraPubblica() {
      localStorage.setItem('filmSalvato', 'true');
    }

    document.addEventListener("DOMContentLoaded", function() {
      if (localStorage.getItem('filmSalvato') === 'true') {
        document.getElementById('formPubblica').style.display = 'block';
      }
    });

    document.getElementById('formPubblica').addEventListener('submit', function() {
      localStorage.removeItem('filmSalvato');
    });

    // 5️⃣ CARICA I FILM DALL'ARCHIVIO
    async function caricaArchivio() {
      try {
        const response = await fetch('/api/caricalibri');
        if (!response.ok) throw new Error('Errore nel caricamento archivio');
        
        const data = await response.json();
        const archivioDiv = document.getElementById('archivio');
        
        if (!archivioDiv) {
          console.error('❌ Elemento #archivio non trovato');
          return;
        }
        
        if (data.films && data.films.length > 0) {
          console.log(`✅ Caricati ${data.films.length} film`);
          
          let htmlFilms = data.films.reverse().map(film => {
            const idUnico = `film-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
            
            return `
              <div id="${film.dataOggi}" class="film-archiviato" data-folder="${film.folder}">
                <form action="/modificaInsert/${film.folder}" method="post">
                  <button type="submit">Modifica ${film.titolo}</button>
                </form>
                
                <h1>${film.titolo}</h1>
                <h3>Film del ${film.dataOggi.replace(/_/g, '/')}</h3>
                <input type="checkbox" id="sidebar-${idUnico}">
                <label for="sidebar-${idUnico}" class="toggle-img">
                  <img src="${film.locandinaUrl}?w=100&h=150&c=fill" width="100" alt="${film.titolo}">
                </label>
                <br>
                <div class="film-details">
                  <label for="sidebar-${idUnico}" class="toggle-archivio">
                    <div class="film-section">
                      <h4>📖 Trama</h4>
                      <p>${film.trama.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>')}</p>
                    </div>
                    <div class="film-section">
                      <h4>💬 Discussione</h4>
                      <p>${film.discussione.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>')}</p>
                    </div>
                  </label>
                </div>
              </div>
            `;
          }).join('');
          
          archivioDiv.innerHTML = htmlFilms;
        } else {
          archivioDiv.innerHTML = '<p>Nessun film disponibile</p>';
        }
      } catch (error) {
        console.error('❌ Errore caricamento archivio:', error);
      }
    }
  </script>

</body>
</html>
