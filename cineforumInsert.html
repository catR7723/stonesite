<div class="scegli">

    <!-- Il div con i testi che arrivano dal server -->
    <div class="film">
        <h1 id="titoloFilm"></h1>
        <h1 id="tramaFilm"></h1>
        <h1 id="discussione"></h1>
    </div>

    <!-- Moduli di inserimento (nascosti di default) -->
    <div class="ins" style="display: none;">
        <form action="/salvaTitoloLocandina" id="salvaLocandina" method="POST">
            <input type="text" id="inputTitolo" name="titoloFilm" placeholder="Inserisci il titolo del Film" required="">
            <button class="btn" id="antTit" type="submit">Anteprima Titolo del Film</button>
        </form>

        <form action="/salvaTrama" id="salvaTrama" method="POST">
            <textarea name="tramaFilm" placeholder="Trama" required=""></textarea>
            <button type="submit" id="salTrama">Salva Trama</button>
        </form>

        <form action="/salvaDiscussione" id="salvaDiscussione" method="POST">
            <textarea name="discussione" placeholder="Discussione" required=""></textarea>
            <button type="submit" id="salDisc">Salva Discussione</button>
        </form>
    </div> 
</div>

<script>
// 1. Gestisce l'apparizione del tasto "Anteprima" quando l'utente seleziona un file dal PC
function mostraBottone() {
    const fileInput = document.getElementById('file-input');
    const btnAnteprima = document.getElementById('btn-anteprima');
    
    if (fileInput && fileInput.files.length > 0) {
        if (btnAnteprima) btnAnteprima.style.display = 'block'; 
    } else {
        if (btnAnteprima) btnAnteprima.style.display = 'none';
    }
}

// 2. Controlla AUTOMATICAMENTE se la locandina esiste già sul server all'apertura della pagina
window.addEventListener('DOMContentLoaded', () => {
    const img = document.getElementById('locandina-img');
    const divIns = document.querySelector('.ins');

    if (img && divIns) {
        // Creiamo un'immagine temporanea in memoria per verificare se il file sul server è valido
        const testImg = new Image();
        testImg.src = img.src;

        testImg.onload = function() {
            // Se l'immagine esiste e viene caricata con successo, mostra i moduli .ins
            divIns.style.display = 'block';
        };

        testImg.onerror = function() {
            // Se l'immagine non esiste (404), i moduli rimangono nascosti
            divIns.style.display = 'none';
        };
    }
});
</script>


<!-- Contenitore Pulsanti Finali -->
<div class="azioni-finali">
  <!-- Form Salva -->
  <form action="/salvaFilm" method="POST" id="formSalva">
    <!-- Al click, esegue la funzione mostraPubblica() -->
    <button class="btn" type="submit" id="salvaFilm" onclick="mostraPubblica()">Salva il Film</button>

  <form action="/salvaFilmR" method="POST" id="formPubblica">

           <script>
function mostraPubblica() {
    // Salva lo stato nel browser prima del ricaricamento del server
    localStorage.setItem('filmSalvato', 'true');
}

// Al caricamento della pagina, controlla se l'utente ha premuto "Salva" in precedenza
document.addEventListener("DOMContentLoaded", function() {
    if (localStorage.getItem('filmSalvato') === 'true') {
        document.getElementById('formPubblica').classList.add('mostra-pubblica');
    }
});

// Opzionale: Se vuoi resettare lo stato quando l'utente clicca su "Pubblica"
document.getElementById('formPubblica').addEventListener('submit', function() {
    localStorage.removeItem('filmSalvato');
});
function mostraFileName() {
    const fileInput = document.getElementById('file-input');
    const fileName = document.getElementById('fileName');
    
    if (fileInput.files.length > 0) {
        fileName.textContent = fileInput.files[0].name;
    } else {
        fileName.textContent = 'Nessun file selezionato';
    }
}
</script>
